"""
Permissions the Vault gives a hook. A concrete hook type fills these in when one is added.
"""
type HookConfig {
    """
    True when the hook can change the amounts sent to the Vault.
    """
    enableHookAdjustedAmounts: Boolean!
    shouldCallAfterSwap: Boolean!
    shouldCallBeforeSwap: Boolean!
    shouldCallAfterInitialize: Boolean!
    shouldCallBeforeInitialize: Boolean!
    shouldCallAfterAddLiquidity: Boolean!
    shouldCallBeforeAddLiquidity: Boolean!
    shouldCallAfterRemoveLiquidity: Boolean!
    shouldCallBeforeRemoveLiquidity: Boolean!
    shouldCallComputeDynamicSwapFee: Boolean!
}

"""
A pool hook. Frontier does not ship hook types yet. An address that is not the zero
address is stored as UNKNOWN until a type is registered in the chain config.
"""
type GqlHook {
    address: String!
    type: GqlHookType!
    config: HookConfig
}

enum GqlHookType {
    UNKNOWN
}
