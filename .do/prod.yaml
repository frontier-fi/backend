# Production Frontier API. On every push to `production`, the Deploy workflow builds one image,
# then applies this file and creates the app if it does not exist. Edits made in the dashboard are
# lost on the next deploy. The workflow fills in the placeholders: IMAGE_DIGEST with the image it
# built, the others with the GitHub secrets of the same name.
#
# Requires Managed Postgres cluster `frontier-db` in fra.
# DEPLOYMENT_ENV=production uses the fast worker intervals. staging is slower.

name: frontier-backend
region: fra

domains:
    - domain: api.frontier.fi
      type: PRIMARY
      zone: frontier.fi

ingress:
    rules:
        - match:
              path:
                  prefix: /
          component:
              name: api

# Same network as frontier-db. Private database hostnames only route inside this VPC.
vpc:
    id: 7f680f6e-a9d2-4ac1-9f9d-2a1f21046cc8

databases:
    - name: db
      engine: PG
      version: '18'
      production: true
      cluster_name: frontier-db
      db_name: frontier
      db_user: frontier

# Alerts email the team's contact address.
alerts:
    - rule: DEPLOYMENT_FAILED
    - rule: DOMAIN_FAILED

envs:
    - key: NODE_ENV
      scope: RUN_TIME
      value: production
    - key: DEPLOYMENT_ENV
      scope: RUN_TIME
      value: production
    - key: DATABASE_URL
      scope: RUN_TIME
      value: ${db.DATABASE_PRIVATE_URL}
    - key: ADMIN_API_KEY
      scope: RUN_TIME
      type: SECRET
      value: '${ADMIN_API_KEY}'
    - key: DRPC_API_KEY
      scope: RUN_TIME
      type: SECRET
      value: '${DRPC_API_KEY}'
    - key: COINGECKO_API_KEY
      scope: RUN_TIME
      type: SECRET
      value: '${COINGECKO_API_KEY}'

services:
    - name: api
      image:
          registry_type: GHCR
          registry: frontier-fi
          repository: backend
          digest: '${IMAGE_DIGEST}'
      http_port: 8080
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-2gb
      health_check:
          initial_delay_seconds: 30
          period_seconds: 10
          timeout_seconds: 5
          http_path: /health
      alerts:
          - rule: CPU_UTILIZATION
            operator: GREATER_THAN
            value: 80
            window: TEN_MINUTES
          - rule: MEM_UTILIZATION
            operator: GREATER_THAN
            value: 85
            window: TEN_MINUTES
          - rule: RESTART_COUNT
            operator: GREATER_THAN
            value: 1
            window: FIVE_MINUTES
      envs:
          - key: PORT
            scope: RUN_TIME
            value: '8080'
          - key: NODE_OPTIONS
            scope: RUN_TIME
            value: '--max-old-space-size=1536'
          - key: SOR_INSTANCE
            scope: RUN_TIME
            value: 'false'
          - key: SOR_SERVICE_URL
            scope: RUN_TIME
            value: http://sor:8080/graphql
      log_destinations:
          - name: better-stack
            logtail:
                token: '${LOGTAIL_TOKEN}'

    - name: sor
      image:
          registry_type: GHCR
          registry: frontier-fi
          repository: backend
          digest: '${IMAGE_DIGEST}'
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-2gb
      internal_ports:
          - 8080
      health_check:
          initial_delay_seconds: 30
          period_seconds: 10
          timeout_seconds: 5
          http_path: /health
          port: 8080
      alerts:
          - rule: CPU_UTILIZATION
            operator: GREATER_THAN
            value: 80
            window: TEN_MINUTES
          - rule: MEM_UTILIZATION
            operator: GREATER_THAN
            value: 85
            window: TEN_MINUTES
          - rule: RESTART_COUNT
            operator: GREATER_THAN
            value: 1
            window: FIVE_MINUTES
      envs:
          - key: PORT
            scope: RUN_TIME
            value: '8080'
          - key: NODE_OPTIONS
            scope: RUN_TIME
            value: '--max-old-space-size=1536'
          - key: SOR_INSTANCE
            scope: RUN_TIME
            value: 'true'
      log_destinations:
          - name: better-stack
            logtail:
                token: '${LOGTAIL_TOKEN}'

workers:
    - name: worker
      image:
          registry_type: GHCR
          registry: frontier-fi
          repository: backend
          digest: '${IMAGE_DIGEST}'
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-2gb
      # Jobs keep the CPU busy by design, so only memory and restarts alert.
      alerts:
          - rule: MEM_UTILIZATION
            operator: GREATER_THAN
            value: 85
            window: TEN_MINUTES
          - rule: RESTART_COUNT
            operator: GREATER_THAN
            value: 1
            window: FIVE_MINUTES
      envs:
          - key: PORT
            scope: RUN_TIME
            value: '8080'
          - key: NODE_OPTIONS
            scope: RUN_TIME
            value: '--max-old-space-size=1536'
          - key: WORKER
            scope: RUN_TIME
            value: 'true'
          - key: SCHEDULER
            scope: RUN_TIME
            value: 'true'
          - key: WORKER_QUEUE_URL
            scope: RUN_TIME
            value: http://localhost:8080
      log_destinations:
          - name: better-stack
            logtail:
                token: '${LOGTAIL_TOKEN}'

jobs:
    - name: migrate
      kind: PRE_DEPLOY
      image:
          registry_type: GHCR
          registry: frontier-fi
          repository: backend
          digest: '${IMAGE_DIGEST}'
      run_command: sh -c 'for i in 1 2 3 4 5; do ./node_modules/.bin/prisma migrate deploy --schema prisma/schema && exit 0; sleep 5; done; exit 1'
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      log_destinations:
          - name: better-stack
            logtail:
                token: '${LOGTAIL_TOKEN}'
