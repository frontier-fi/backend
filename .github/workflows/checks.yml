name: Checks

on:
    - pull_request

jobs:
    Build:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
        steps:
            - uses: actions/checkout@v7
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install deps
              run: bun install --frozen-lockfile
            - name: Generate GraphQL clients and API schema
              env:
                  PORT: 4000
                  NODE_ENV: local
                  DEPLOYMENT_ENV: canary
                  ADMIN_API_KEY: ci
              run: bun prisma generate && bun run generate
            - name: Run build
              run: bun run build
            - name: Typecheck tests
              run: bun run typecheck:tests
