name: Checks

on:
    pull_request:
    schedule:
        # Daily check that live Ormi Labs subgraph schemas remain compatible with our queries and build.
        - cron: '0 6 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # The production ruleset requires this job by name.
    Build:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Read the Bun version from the Dockerfile
              id: bun
              run: |
                  version=$(sed -nE 's/^FROM oven\/bun:([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Dockerfile)
                  test -n "$version" || { echo "::error::The Dockerfile has no FROM oven/bun:<version> line."; exit 1; }
                  echo "version=$version" >> "$GITHUB_OUTPUT"
            - name: Use Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ steps.bun.outputs.version }}
            - name: Install deps
              run: bun install --frozen-lockfile
            - name: Check formatting
              run: bun run format:check
            - name: Generate GraphQL clients and API schema
              env:
                  PORT: 4000
                  NODE_ENV: staging
                  DEPLOYMENT_ENV: staging
                  ADMIN_API_KEY: ci
              run: bunx prisma generate --schema prisma/schema && bun run generate
            - name: Run unit tests
              run: bun run test -- run
            - name: Run build
              run: bun run build
            - name: Typecheck tests
              run: bun run typecheck:tests
