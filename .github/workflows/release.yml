name: Release

on:
    workflow_dispatch:

permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            # A pull request opened with GITHUB_TOKEN starts no workflows, so the Build check that the
            # production ruleset requires would never run. One opened by the maxyz-actions app does.
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: Iv23lin88uMBRaCQ5SzJ
                  private-key: ${{ secrets.MAXYZ_ACTIONS_PRIVATE_KEY }}
                  permission-contents: read
                  permission-pull-requests: write

            - name: Open or update the release pull request
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  title="Release $(date -u +%F): staging → production"
                  prs=$(gh api "repos/$GITHUB_REPOSITORY/compare/production...staging" --jq '.commits[].commit.message' \
                      | grep -oE '^Merge pull request #[0-9]+' | grep -oE '[0-9]+$' | sort -un || true)
                  {
                      echo "Merging this deploys \`staging\` to production."
                      if [ -n "$prs" ]; then
                          printf '\n## Pull requests\n\n'
                          for number in $prs; do
                              gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json number,title --jq '"- #\(.number) \(.title)"'
                          done
                      fi
                  } > body.md

                  open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base production --head staging --state open --json number --jq '.[0].number // empty')
                  if [ -n "$open" ]; then
                      gh pr edit "$open" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
                  else
                      gh pr create --repo "$GITHUB_REPOSITORY" --base production --head staging --title "$title" --body-file body.md
                  fi
