name: Release

on:
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Create publish to production Pull Request
              run: gh pr create -B production -H staging --title 'publish to production' --body 'Publish staging to production.'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
