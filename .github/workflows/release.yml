name: Release

on:
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Create publish to production Pull Request
              run: gh pr create -B production -H staging --title 'publish to production' --body 'Publish staging to production.'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
