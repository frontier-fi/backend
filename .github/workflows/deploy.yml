name: Deploy

on:
    push:
        branches:
            - production

concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
        steps:
            - uses: actions/checkout@v7
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install deps
              run: bun install --frozen-lockfile
            - name: Generate GraphQL clients and API schema
              env:
                  PORT: 4000
                  NODE_ENV: staging
                  DEPLOYMENT_ENV: staging
                  ADMIN_API_KEY: ci
              run: bunx prisma generate --schema prisma/schema && bun run generate
            - name: Run build
              run: bun run build

    deploy:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7

            - name: Check DigitalOcean token
              id: token
              env:
                  DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
              run: |
                  if [ -z "$DIGITALOCEAN_ACCESS_TOKEN" ]; then
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                      echo "DIGITALOCEAN_ACCESS_TOKEN is unset. Skipping DigitalOcean deploy."
                  else
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Install doctl
              if: steps.token.outputs.ready == 'true'
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Deploy app
              if: steps.token.outputs.ready == 'true'
              env:
                  DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
                  ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
                  DRPC_API_KEY: ${{ secrets.DRPC_API_KEY }}
                  COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
              run: bash scripts/deploy-digitalocean.sh
