version: 2
updates:
    # Workflow actions are pinned to commit SHAs, and the Dockerfile base images to digests.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns:
                  - '*'
    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
