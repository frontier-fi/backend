services:
    postgres:
        container_name: frontier-backend
        image: postgres:17-alpine
        ports:
            - '5431:5432'
        environment:
            POSTGRES_USER: backend
            POSTGRES_PASSWORD: let-me-in
            POSTGRES_DB: database
        volumes:
            - frontier-pg:/var/lib/postgresql/data
        networks:
            - balancer

networks:
    balancer:
        name: balancer

volumes:
    frontier-pg:
